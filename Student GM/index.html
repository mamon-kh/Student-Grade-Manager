<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Student Grade Manager</h1>

    <div class="form">

        <div>
            <label for="nameInput">Student Name</label>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter student name"
            >
        </div>

        <div>
            <label for="scoreInput">Score</label>

            <input
                type="number"
                id="scoreInput"
                placeholder="Enter score"
                min="0"
                max="100"
            >
        </div>

        <button id="addBtn">Add Student</button>

    </div>


    <div class="search">

        <label for="searchInput">Search Students</label>

        <input
            type="text"
            id="searchInput"
            placeholder="Search student name"
        >

    </div>


    <button id="clearBtn">Clear All Students</button>


    <table>

        <thead>

            <tr>
                <th>Name</th>
                <th>Score</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="tbody">

        </tbody>

    </table>

</div>


<script src="test.js"></script>

</body>

</html>
